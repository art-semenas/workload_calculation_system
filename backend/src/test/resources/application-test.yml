spring:
  datasource:
    url: jdbc:tc:postgresql:15:///workload
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    # Exclude the 2934-object demo dataset (v1.0.6 / v1.0.9). Tests build their own fixtures,
    # and the startup recalculation would otherwise process every seeded object on each boot.
    contexts: '!demo-data'

jwt:
  secret: test-secret-key-minimum-32-characters-long-for-hmac

rate-limit:
  unauthenticated-capacity: 10000
  authenticated-capacity: 10000

workload:
  config:
    planning-period-months: 6
    productive-months: 5
    repair-travel-zero-threshold: 5
    repair-travel-cap: 10
    pzv-minutes: 20
    engineer-warning-threshold: 0.9
    engineer-overload-threshold: 1.0
    os-r1-visits-per-year: 10
    os-r2-visits-per-year: 2
    ps-r1-visits-per-year: 8
    ps-r2-visits-per-year: 4
    video-r1-visits-per-year: 10
    video-r2-visits-per-year: 2
    records-access-minutes: 60
    records-monitoring-minutes: 180
    records-footage-minutes: 20
    records-backup-minutes: 3.15
    records-admin-minutes: 60
    monthly-hours-fund: 142.8
    absence-coefficient: 1.12
