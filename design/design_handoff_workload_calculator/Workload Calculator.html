<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Workload Calculator — Design Exploration</title>
  <meta name="viewport" content="width=1600"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    html, body { background: #eceae4; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens/dashboard.jsx"></script>
  <script type="text/babel" src="screens/svod.jsx"></script>
  <script type="text/babel" src="screens/object-detail.jsx"></script>
  <script type="text/babel" src="screens/engineers.jsx"></script>
  <script type="text/babel" src="screens/catalog.jsx"></script>
  <script type="text/babel" src="screens/login.jsx"></script>

  <script type="text/babel" data-presets="react">
    function App() {
      const { DashboardScreen, SvodScreen, ObjectDetailScreen, EngineersScreen, CatalogScreen, LoginScreen, LoginMinimalScreen } = window;
      return (
        <DesignCanvas
          title="Workload Calculator"
          subtitle="Original hi-fi design concept for a security-systems maintenance workload tool. Rooted in the existing MUI frontend structure (Dashboard · СВОД · Object Detail · Engineers · Catalog) but elevated with a numeric-first typography system, slate neutrals, and data-dense composition. Click any artboard to focus."
        >
          <DCSection id="auth" title="Authentication">
            <DCArtboard id="login-split" label="00 · Login — split brand pane" width={1440} height={900}>
              <LoginScreen/>
            </DCArtboard>
            <DCArtboard id="login-minimal" label="00b · Login — minimal card" width={1440} height={900}>
              <LoginMinimalScreen/>
            </DCArtboard>
          </DCSection>

          <DCSection id="workspace" title="Workspace · daily operator surfaces">
            <DCArtboard id="dashboard" label="01 · Dashboard" width={1440} height={900}>
              <DashboardScreen/>
            </DCArtboard>
            <DCArtboard id="svod" label="02 · Consolidated Summary (СВОД)" width={1440} height={900}>
              <SvodScreen/>
            </DCArtboard>
            <DCArtboard id="object" label="03 · Object Detail" width={1440} height={900}>
              <ObjectDetailScreen/>
            </DCArtboard>
          </DCSection>

          <DCSection id="management" title="Management · engineer capacity & admin">
            <DCArtboard id="engineers" label="04 · Engineers" width={1440} height={900}>
              <EngineersScreen/>
            </DCArtboard>
            <DCArtboard id="catalog" label="05 · Device catalog" width={1440} height={900}>
              <CatalogScreen/>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
