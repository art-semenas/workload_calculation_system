$kind: http-request
name: 03 Create Branch in Division
order: 6000
method: POST
url: "{{baseUrl}}/api/v1/divisions/{{divisionId}}/branches"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{branchName}}"
    }
event:
  - listen: test
    script:
      type: text/javascript
      exec:
        - const body = pm.response.json();
        - const branchId = body?.data?.id;
        - pm.test('branch id captured', () => pm.expect(branchId).to.be.a('string').and.not.empty);
        - pm.collectionVariables.set('branchId', branchId);
        - pm.collectionVariables.unset('objectId');
        - pm.collectionVariables.unset('assignmentId');
