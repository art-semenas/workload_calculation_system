$kind: http-request
name: 07 Create Assignment
order: 6000
method: POST
url: "{{baseUrl}}/api/v1/objects/{{objectId}}/assignments"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "deviceTypeId": "{{deviceTypeId}}",
      "systemType": "{{assignmentSystemType}}",
      "quantityMaintained": {{quantityMaintained}}
    }
event:
  - listen: test
    script:
      type: text/javascript
      exec:
        - const body = pm.response.json();
        - const assignmentId = body?.data?.id;
        - if (assignmentId) { pm.collectionVariables.set('assignmentId', assignmentId); }
