name: Backend CI

on:
  push:
    branches: [main, develop, "feature/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: fast checks (no tests, no Docker) ──────────────
  codestyle:
    name: Spotless (code formatting)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check formatting
        working-directory: backend
        run: mvn -B spotless:check

  static-analysis:
    name: SpotBugs (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and run SpotBugs
        working-directory: backend
        run: mvn -B compile spotbugs:check

  # ── Stage 2: tests (run in parallel after lint gates pass) ───
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [codestyle, static-analysis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests (*Test.java only)
        working-directory: backend
        run: >
          mvn -B test
          -Dsurefire.includes="**/*Test.java"
          -Dsurefire.excludes="**/*IT.java"
          -Dspotless.check.skip=true
          -Dspotbugs.skip=true
          -Djacoco.skip=true
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/target/surefire-reports/

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [codestyle, static-analysis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the runner's Docker daemon directly —
      # no service container needed (application-test.yml configures
      # jdbc:tc:postgresql:15 which auto-starts a container per test run).
      - name: Run integration tests (*IT.java only)
        working-directory: backend
        run: >
          mvn -B test
          -Dsurefire.includes="**/*IT.java"
          -Dsurefire.excludes=""
          -Dspotless.check.skip=true
          -Dspotbugs.skip=true
          -Djacoco.skip=true
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/target/surefire-reports/

  # ── Stage 3: coverage (needs all tests green) ───────────────
  coverage:
    name: Jacoco coverage check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Runs all tests together so Jacoco agent collects combined
      # coverage, then enforces TOR §19.2 thresholds via jacoco:check.
      - name: Run all tests with coverage
        working-directory: backend
        run: >
          mvn -B verify
          -Dspotless.check.skip=true
          -Dspotbugs.skip=true
      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
