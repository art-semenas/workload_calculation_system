name: Frontend CI

on:
  push:
    branches: [main, develop, "feature/**"]
    paths:
      - "frontend/**"
      - "docker-compose.poc.yml"
      - "nginx.poc.conf"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop, "feature/**"]
    paths:
      - "frontend/**"
      - "docker-compose.poc.yml"
      - "nginx.poc.conf"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: fast checks (no build, no Docker) ───────────────
  format-check:
    name: Prettier (format check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint

  type-check:
    name: TypeScript (type check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── Stage 2: unit tests (run after all lint gates pass) ───────
  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [format-check, lint, type-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run unit tests
        working-directory: frontend
        run: npm test

  # ── Stage 3: build (needs unit tests green) ──────────────────
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Stage 4: E2E tests (full PoC stack, needs build green) ────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    env:
      POSTGRES_PASSWORD: ${{ secrets.E2E_POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
      # Used by helpers/data.ts cleanupHierarchyByPrefix to connect via docker exec
      PLAYWRIGHT_POSTGRES_PASSWORD: ${{ secrets.E2E_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Build and start PoC stack
        run: docker compose -f docker-compose.poc.yml up -d --build

      - name: Wait for stack to be healthy
        # nginx exposes /actuator/health proxied directly from the backend
        run: |
          echo "Waiting for backend to be ready via nginx..."
          timeout 120 bash -c '
            until curl -sf http://localhost/actuator/health > /dev/null 2>&1; do
              echo "  not ready yet, retrying in 5s..."
              sleep 5
            done
          '
          echo "Stack is ready."

      - name: Run Playwright tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: frontend/test-results/
          retention-days: 7

      - name: Stop PoC stack
        if: always()
        run: docker compose -f docker-compose.poc.yml down -v
